# icon-overrides.conf
# ============================================================================
# Manual slug -> icon overrides for IconPatcher.sh.
#
# Use this when an app's normalized "slug" (derived from its .desktop
# file's Name=) doesn't match the icon filename you want it to use —
# punctuation, subtitles, vendor prefixes, or several apps that should
# share one icon.
#
# This file is read directly by IconPatcher.sh every run. Just add, edit,
# or delete lines — no need to touch the script itself.
#
#
# HOW TO FIND AN APP'S SLUG
# ----------------------------------------------------------------------------
# Run the patcher in dry-run mode:
#
#     IconPatcher.sh 000000 --dry-run
#
# This scans every .desktop file on the system and prints a table:
#
#     NAME                    SLUG                    ICON        SOURCE
#     Visual Studio Code      visual_studio_code       vscode      override
#     Some New App            some_new_app             -           no match, untouched
#
# The SLUG column is the exact key to use on the left of "=" below. The
# ICON column shows what it currently resolves to (or "-" if untouched).
# Re-run --dry-run after editing this file to confirm your change took.
#
#
# HOW TO ADD OR REMOVE AN OVERRIDE
# ----------------------------------------------------------------------------
# One override per line:
#
#     slug = icon_base_name
#
# - slug            the left-hand column from --dry-run output.
# - icon_base_name   the base SVG to use, without the "_base_icon.svg"
#                    suffix. The engine looks for
#                    <icon_base_name>_base_icon.svg first in the games
#                    icon folder (svg/games/), then in the main icon
#                    folder (svg/). The base SVG file must already exist
#                    in one of those folders — this file only tells the
#                    engine which one to pick, it doesn't create icons.
#
# To remove an override, delete its line (or comment it out with a
# leading #) — the app then falls back to matching its own slug, game
# detection, its Categories=, or the catch-all icon, in that order.
#
# Rules:
#   - Lines starting with # are comments and are ignored.
#   - Blank lines are ignored.
#   - Whitespace around "=" is ignored, so "slug=icon" and
#     "slug = icon" are equivalent.
#   - Only the first "=" on a line is treated as the separator.
#   - If the same slug appears more than once, the last one wins.
# ============================================================================

